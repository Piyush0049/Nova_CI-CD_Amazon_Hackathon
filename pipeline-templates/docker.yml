# Docker Multi-Stage Build CI/CD Pipeline
# This template builds and deploys containerized applications

stages:
  - build
  - test
  - scan
  - push
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest

# Build Docker image
build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker image..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --cache-from $LATEST_TAG -t $IMAGE_TAG -t $LATEST_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    name: "docker-image-$CI_COMMIT_SHORT_SHA"
    path: image.tar
    expire_in: 1 hour

# Run container tests
test_container:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Testing Docker container..."
    - docker load -i image.tar
    - docker run --rm $IMAGE_TAG npm test
  dependencies:
    - build_image

# Vulnerability scan
scan_vulnerabilities:
  stage: scan
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Scanning for vulnerabilities..."
    - docker load -i image.tar
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE_TAG
  dependencies:
    - build_image
  allow_failure: true

# Lint Dockerfile
lint_dockerfile:
  stage: scan
  image: hadolint/hadolint:latest-alpine
  script:
    - echo "Linting Dockerfile..."
    - hadolint Dockerfile --ignore DL3008 --ignore DL3009
  allow_failure: true

# Push to registry
push_to_registry:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Pushing image to registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker load -i image.tar
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  dependencies:
    - build_image
  only:
    - main
    - develop

# Tag release
tag_release:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Tagging release version..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker load -i image.tar
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  dependencies:
    - build_image
  only:
    - tags

# Deploy to Kubernetes (Staging)
deploy_k8s_staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Kubernetes staging..."
    - kubectl config use-context staging
    - kubectl set image deployment/app app=$IMAGE_TAG -n staging
    - kubectl rollout status deployment/app -n staging
  environment:
    name: staging
    url: https://staging.example.com
  dependencies:
    - push_to_registry
  only:
    - develop

# Deploy to Kubernetes (Production)
deploy_k8s_production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Kubernetes production..."
    - kubectl config use-context production
    - kubectl set image deployment/app app=$IMAGE_TAG -n production
    - kubectl rollout status deployment/app -n production
  environment:
    name: production
    url: https://example.com
  dependencies:
    - push_to_registry
  only:
    - main
  when: manual

# Deploy to Docker Swarm
deploy_swarm:
  stage: deploy
  image: docker:latest
  script:
    - echo "Deploying to Docker Swarm..."
    - docker stack deploy -c docker-compose.yml myapp
  environment:
    name: swarm-production
  dependencies:
    - push_to_registry
  only:
    - main
  when: manual
